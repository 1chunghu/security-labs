<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="720" height="380" rx="10" fill="#2e3440"/>
  <text x="360" y="34" text-anchor="middle" fill="#eceff4" font-size="17" font-weight="600">Firewall Throughput Lab</text>
  <text x="360" y="56" text-anchor="middle" fill="#81a1c1" font-size="12.5">two VLANs routed and filtered through a FortiGate</text>

  <!-- VLAN labels -->
  <text x="160" y="88" text-anchor="middle" fill="#88c0d0" font-size="12.5" font-weight="600">VLAN 10 &#8226; 10.0.10.0/24</text>
  <text x="560" y="88" text-anchor="middle" fill="#ebcb8b" font-size="12.5" font-weight="600">VLAN 20 &#8226; 10.0.20.0/24</text>

  <!-- PC1 -->
  <rect x="90" y="100" width="140" height="60" rx="8" fill="#3b4252" stroke="#88c0d0" stroke-width="1.5"/>
  <text x="160" y="126" text-anchor="middle" fill="#eceff4" font-size="13" font-weight="600">PC1</text>
  <text x="160" y="146" text-anchor="middle" fill="#9aa5b8" font-size="11.5">10.0.10.100</text>

  <!-- PC2 -->
  <rect x="490" y="100" width="140" height="60" rx="8" fill="#3b4252" stroke="#ebcb8b" stroke-width="1.5"/>
  <text x="560" y="126" text-anchor="middle" fill="#eceff4" font-size="13" font-weight="600">PC2</text>
  <text x="560" y="146" text-anchor="middle" fill="#9aa5b8" font-size="11.5">10.0.20.100</text>

  <!-- switch -->
  <rect x="230" y="196" width="260" height="44" rx="8" fill="#434c5e" stroke="#4c566a"/>
  <text x="360" y="215" text-anchor="middle" fill="#d8dee9" font-size="13" font-weight="600">SW1 &#8212; Cisco IOL (L2)</text>
  <text x="360" y="232" text-anchor="middle" fill="#9aa5b8" font-size="11">access ports: VLAN10 / VLAN20</text>

  <!-- links PC-switch -->
  <line x1="160" y1="160" x2="160" y2="218" stroke="#4c566a" stroke-width="2"/>
  <line x1="160" y1="218" x2="230" y2="218" stroke="#4c566a" stroke-width="2"/>
  <line x1="560" y1="160" x2="560" y2="218" stroke="#4c566a" stroke-width="2"/>
  <line x1="560" y1="218" x2="490" y2="218" stroke="#4c566a" stroke-width="2"/>

  <!-- firewall -->
  <rect x="230" y="278" width="260" height="66" rx="8" fill="#3b4252" stroke="#bf616a" stroke-width="1.5"/>
  <text x="360" y="302" text-anchor="middle" fill="#bf616a" font-size="13.5" font-weight="600">FortiGate</text>
  <text x="360" y="320" text-anchor="middle" fill="#eceff4" font-size="11">port2 10.0.10.1 &#8226; port3 10.0.20.1</text>
  <text x="360" y="336" text-anchor="middle" fill="#9aa5b8" font-size="11">policies: VLAN10 &#8596; VLAN20, internal &#8594; WAN (NAT)</text>

  <!-- link switch-fw -->
  <line x1="360" y1="240" x2="360" y2="278" stroke="#4c566a" stroke-width="2"/>

  <!-- caption -->
</svg>
