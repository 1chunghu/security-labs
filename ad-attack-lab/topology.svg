<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="720" height="340" rx="10" fill="#2e3440"/>
  <text x="360" y="34" text-anchor="middle" fill="#eceff4" font-size="17" font-weight="600">Active Directory Attack Lab</text>
  <text x="360" y="56" text-anchor="middle" fill="#81a1c1" font-size="12.5">domain lab.local &#8226; 10.10.10.0/24 &#8226; isolated, no gateway</text>

  <!-- switch bar -->
  <rect x="120" y="196" width="480" height="30" rx="6" fill="#434c5e" stroke="#4c566a"/>
  <text x="360" y="215" text-anchor="middle" fill="#d8dee9" font-size="12.5">Layer-2 switch (single segment)</text>
  <line x1="210" y1="170" x2="210" y2="196" stroke="#4c566a" stroke-width="2"/>
  <line x1="360" y1="170" x2="360" y2="196" stroke="#4c566a" stroke-width="2"/>
  <line x1="510" y1="170" x2="510" y2="196" stroke="#4c566a" stroke-width="2"/>

  <!-- DC01 -->
  <rect x="130" y="86" width="160" height="84" rx="8" fill="#3b4252" stroke="#88c0d0" stroke-width="1.5"/>
  <text x="210" y="110" text-anchor="middle" fill="#88c0d0" font-size="14" font-weight="600">DC01</text>
  <text x="210" y="130" text-anchor="middle" fill="#eceff4" font-size="11.5">10.10.10.10 &#8226; Server 2022</text>
  <text x="210" y="148" text-anchor="middle" fill="#9aa5b8" font-size="11">AD DS + DNS</text>
  <text x="210" y="163" text-anchor="middle" fill="#9aa5b8" font-size="11">domain controller</text>

  <!-- WS01 -->
  <rect x="280" y="86" width="160" height="84" rx="8" fill="#3b4252" stroke="#a3be8c" stroke-width="1.5"/>
  <text x="360" y="110" text-anchor="middle" fill="#a3be8c" font-size="14" font-weight="600">WS01</text>
  <text x="360" y="130" text-anchor="middle" fill="#eceff4" font-size="11.5">10.10.10.20 &#8226; Server 2022</text>
  <text x="360" y="148" text-anchor="middle" fill="#9aa5b8" font-size="11">domain member</text>
  <text x="360" y="163" text-anchor="middle" fill="#9aa5b8" font-size="11">(phished user's host)</text>

  <!-- kali -->
  <rect x="430" y="86" width="160" height="84" rx="8" fill="#3b4252" stroke="#bf616a" stroke-width="1.5"/>
  <text x="510" y="110" text-anchor="middle" fill="#bf616a" font-size="14" font-weight="600">kali</text>
  <text x="510" y="130" text-anchor="middle" fill="#eceff4" font-size="11.5">10.10.10.50</text>
  <text x="510" y="148" text-anchor="middle" fill="#9aa5b8" font-size="11">attacker</text>
  <text x="510" y="163" text-anchor="middle" fill="#9aa5b8" font-size="11">no credentials at start</text>

  <!-- attack chain -->
  <text x="360" y="262" text-anchor="middle" fill="#d8dee9" font-size="12" font-weight="600">unauthenticated &#8594; Domain Admin, configuration abuse only (no CVE)</text>
  <text x="360" y="286" text-anchor="middle" fill="#ebcb8b" font-size="11.5">AS-REP roast &#8594; Kerberoast &#8594; password in description &#8594; weak DA password</text>
</svg>
