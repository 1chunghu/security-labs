title: Password Spray - many accounts failing from one source
id: 26eadf69-630b-4c48-ba54-f4cb5dbf42af
status: experimental
description: >
  A single source producing failed network logons (event 4625, logon type 3)
  against many distinct accounts inside a short window - the shape of a
  low-and-slow password spray rather than a single-account brute force.
references:
  - https://github.com/1chunghu/security-labs/tree/main/ad-attack-lab
author: 1chung
date: 2026-09-18
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    LogonType: '3'
  timeframe: 10m
  condition: selection | count(TargetUserName) by IpAddress > 10
falsepositives:
  - A misconfigured service or scheduled task with a stale password hitting
    several resources. Confirm the source host and the account pattern.
level: high
tags:
  - attack.credential_access
  - attack.t1110.003
